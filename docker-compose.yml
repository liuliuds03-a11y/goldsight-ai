# GoldSight AI V3.0 - Docker Compose 本地开发环境
# 用途：提供 PostgreSQL 与 Redis 基础设施服务
# 启动命令：docker compose up -d
# 停止命令：docker compose down

# 注意：Docker Compose V2 已不再需要 version 字段
# version: "3.9"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: goldsight-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldsight}
      POSTGRES_USER: ${POSTGRES_USER:-goldsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goldsight_dev_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldsight} -d ${POSTGRES_DB:-goldsight}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goldsight-network

  # Redis 缓存与消息队列
  redis:
    image: redis:7-alpine
    container_name: goldsight-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-goldsight_redis_dev_2024}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-goldsight_redis_dev_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goldsight-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  goldsight-network:
    driver: bridge
